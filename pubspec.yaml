name: project_eden
description: "에덴 성경책 - 성경 읽기 + 맞춤 힐링 앱"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # TTS (음성 읽기)
  flutter_tts: ^4.2.0

  # Utilities
  shared_preferences: ^2.3.2
  share_plus: ^9.0.0
  url_launcher: ^6.2.5
  path_provider: ^2.1.4
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#F5F3EE"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFDF7"
  image: "assets/images/icon.png"
  color_dark: "#1C1C1E"
  image_dark: "assets/images/icon.png"
  android_12:
    color: "#FFFDF7"
    icon_background_color: "#FFFDF7"
    image: "assets/images/icon.png"
    color_dark: "#1C1C1E"
    icon_background_color_dark: "#1C1C1E"
    image_dark: "assets/images/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/home/
    - assets/images/bible/
    - assets/images/books/
    - assets/images/counsel/
    - assets/images/shared/
    - assets/images/splash/
